name: Fix import date type once

on:
  push:
    branches:
      - agent/uiux-2026-import-review
    paths:
      - ".github/workflows/fix-import-date-type-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out review branch
        uses: actions/checkout@v6
        with:
          ref: agent/uiux-2026-import-review

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.1"

      - name: Add explicit date boundary, remove this workflow, and commit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/kakeibo/import_review.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from dataclasses import asdict, dataclass\n",
              "from dataclasses import asdict, dataclass\nfrom datetime import date\n",
              1,
          )
          marker = "\ndef _aggregate(raw: pl.DataFrame, cleaned: pl.DataFrame) -> Aggregate:\n"
          helper = '''\ndef _iso_date(value: object) -> str | None:\n    if value is None:\n        return None\n    if not isinstance(value, date):\n        raise ReviewRejected("normalized transaction date is invalid")\n    return value.isoformat()\n\n\ndef _aggregate(raw: pl.DataFrame, cleaned: pl.DataFrame) -> Aggregate:\n'''
          if marker not in text:
              raise SystemExit("aggregate marker not found")
          text = text.replace(marker, helper, 1)
          text = text.replace(
              "date_min=date_min_value.isoformat() if date_min_value is not None else None,\n"
              "        date_max=date_max_value.isoformat() if date_max_value is not None else None,",
              "date_min=_iso_date(date_min_value),\n        date_max=_iso_date(date_max_value),",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          uv sync --frozen
          uv run ruff check --select I --fix src/kakeibo/import_review.py
          uv run ruff format src/kakeibo/import_review.py
          rm .github/workflows/fix-import-date-type-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kakeibo/import_review.py .github/workflows/fix-import-date-type-once.yml
          git commit -m "Validate normalized import date types"
          git push origin HEAD:agent/uiux-2026-import-review
