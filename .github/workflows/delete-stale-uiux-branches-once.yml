name: Delete stale UIUX branches once

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  delete-explicit-branches:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/delete-stale-uiux-branches'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Delete only the named merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          delete_ref() {
            local ref="$1"
            curl --fail-with-body --silent --show-error \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/${ref}"
          }
          delete_ref "agent/uiux-2026-import-review"
          delete_ref "agent/cleanup-uiux-branches-once"
          delete_ref "agent/delete-stale-uiux-branches"
