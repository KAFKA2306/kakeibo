name: Privacy guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    name: privacy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject secrets and financial artifacts
        run: python3 scripts/privacy_guard.py --all-files
