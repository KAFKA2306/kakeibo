name: Format import review once

on:
  push:
    branches:
      - agent/uiux-2026-import-review
    paths:
      - ".github/workflows/format-import-review-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out review branch
        uses: actions/checkout@v6
        with:
          ref: agent/uiux-2026-import-review

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.1"

      - name: Fix imports, format, remove this workflow, and commit
        run: |
          uv sync --frozen
          uv run ruff check --select I --fix src/kakeibo/import_review.py tests/test_import_review.py src/kakeibo/cli.py
          uv run ruff format src/kakeibo/import_review.py tests/test_import_review.py src/kakeibo/cli.py
          rm .github/workflows/format-import-review-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kakeibo/import_review.py tests/test_import_review.py src/kakeibo/cli.py .github/workflows/format-import-review-once.yml
          git commit -m "Format local import review implementation"
          git push origin HEAD:agent/uiux-2026-import-review
