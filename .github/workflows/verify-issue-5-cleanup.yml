name: Verify issue 5 and cleanup branch

# One-time verification trigger: 2026-08-03-mypy-fixed
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-issue-5-cleanup.yml

permissions:
  contents: write
  issues: write

jobs:
  verify-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked environment
        run: uv sync --frozen
      - name: Run all quality gates and persist logs
        run: |
          set +e
          uv run python scripts/privacy_guard.py --all-files > /tmp/privacy.log 2>&1
          privacy=$?
          uv run ruff check . > /tmp/ruff.log 2>&1
          ruff=$?
          uv run mypy --explicit-package-bases src/kakeibo > /tmp/mypy.log 2>&1
          mypy=$?
          uv run pytest > /tmp/pytest.log 2>&1
          pytest_status=$?
          set -e
          for file in privacy ruff mypy pytest; do echo "===== $file ====="; cat "/tmp/$file.log"; done
          PRIVACY="$privacy" RUFF="$ruff" MYPY="$mypy" PYTEST_STATUS="$pytest_status" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          workspace = str(Path.cwd())

          def sanitized_log(name: str) -> str:
              text = Path(f'/tmp/{name}.log').read_text(encoding='utf-8', errors='replace')
              return text.replace(workspace, '<workspace>')[-12000:]

          codes = {
              'privacy': int(os.environ['PRIVACY']),
              'ruff': int(os.environ['RUFF']),
              'mypy': int(os.environ['MYPY']),
              'pytest': int(os.environ['PYTEST_STATUS']),
          }
          payload = {
              'schema_version': 1,
              'issue': 5,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'status': 'passed' if all(code == 0 for code in codes.values()) else 'failed',
              'commands': {
                  'privacy': 'uv run python scripts/privacy_guard.py --all-files',
                  'ruff': 'uv run ruff check .',
                  'mypy': 'uv run mypy --explicit-package-bases src/kakeibo',
                  'pytest': 'uv run pytest',
              },
              'exit_codes': codes,
              'logs': {name: sanitized_log(name) for name in codes},
          }
          Path('/tmp/issue-5-verification.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Publish and privacy-check audit evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p audit
          cp /tmp/issue-5-verification.json audit/issue-5-verification.json
          uv run python scripts/privacy_guard.py --all-files
          git add audit/issue-5-verification.json
          git commit -m 'test: record issue 5 verification evidence [skip ci]' || true
          git push origin HEAD:main
      - name: Require all gates to pass
        run: python -c "import json,sys; data=json.load(open('audit/issue-5-verification.json')); sys.exit(0 if data['status']=='passed' else 1)"
      - name: Remove one-time workflow
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/verify-issue-5-cleanup.yml
          git commit -m 'chore: remove issue 5 verification workflow [skip ci]'
          git push origin HEAD:main
      - name: Close issue and delete merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close 5 --repo "$GITHUB_REPOSITORY" --reason completed \
            --comment 'Implemented explicit statement type dispatch for API and CLI, rejected unsupported type/suffix combinations, removed arbitrary TXT-to-Sony fallback, and passed privacy, lint, typecheck, and test gates.'
          for branch in agent/fix-explicit-statement-type ops/trigger-issue-5-verification agent/fix-issue-5-verification agent/remove-workflow-path-leak agent/fix-mypy-baseline; do
            git push origin --delete "$branch" || true
          done
