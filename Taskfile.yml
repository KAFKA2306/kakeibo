version: '3'

tasks:
  install:
    desc: Install dependencies
    cmds:
      - uv sync

  privacy:
    desc: Reject secrets and personal finance artifacts
    cmds:
      - uv run python scripts/privacy_guard.py --all-files

  test:
    desc: Run tests
    deps: [privacy]
    cmds:
      - uv run pytest

  lint:
    desc: Run linters
    cmds:
      - uv run ruff check .

  format:
    desc: Format code
    cmds:
      - uv run ruff format .
      - uv run ruff check --select I --fix .

  typecheck:
    desc: Run static type checks
    cmds:
      - uv run mypy src/

  check:
    desc: Run privacy, lint, type and test gates
    deps: [privacy, lint, typecheck, test]

  dev:
    desc: Run the API server in development mode
    cmds:
      - uv run uvicorn src.kakeibo.api:app --reload

  cli:
    desc: Run the CLI
    cmds:
      - uv run python src/kakeibo/cli.py {{.CLI_ARGS}}
